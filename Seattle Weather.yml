info:
  name: Seattle Weather
  type: http
  seq: 1

http:
  method: GET
  url: https://api.openweathermap.org/data/2.5/weather?lat=47.60621&lon=-122.33207&appid={{API-Key}}
  params:
    - name: lat
      value: "47.60621"
      type: query
    - name: lon
      value: "-122.33207"
      type: query
    - name: appid
      value: "{{API-Key}}"
      type: query
  auth:
    type: apikey
    key: "{{API-Key}}"
    placement: query

runtime:
  scripts:
    - type: after-response
      code: |-
        const { kelvinToFahrenheit } = require('./Temp-sample-scripts.js');

        const tempK = res('main.temp');
        const feelsLikeK = res('main.feels_like');

        bru.setVar('tempF', kelvinToFahrenheit(tempK));
        bru.setVar('feelsLikeF', kelvinToFahrenheit(feelsLikeK));

        console.log(`${res('name')}: ${bru.getVar('tempF')}°F (feels like ${bru.getVar('feelsLikeF')}°F)`);
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
