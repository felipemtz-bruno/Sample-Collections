info:
  name: Seattle Weather
  type: http
  seq: 1

http:
  method: GET
  url: https://api.openweathermap.org/data/2.5/weather?lat=47.60621&lon=-122.33207&appid={{API-Key}}
  params:
    - name: lat
      value: "47.60621"
      type: query
    - name: lon
      value: "-122.33207"
      type: query
    - name: appid
      value: "{{API-Key}}"
      type: query
  auth:
    type: apikey
    key: "{{API-Key}}"
    placement: query

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
