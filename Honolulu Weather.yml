info:
  name: Honolulu Weather
  type: http
  seq: 5

http:
  method: GET
  url: https://api.openweathermap.org/data/2.5/weather?q=Honolulu&appid={{API-Key}}
  params:
    - name: q
      value: Honolulu
      type: query
    - name: appid
      value: "{{API-Key}}"
      type: query
  auth:
    type: apikey
    key: "{{API-Key}}"
    placement: query

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
