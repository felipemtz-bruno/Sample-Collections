info:
  name: San Francisco Weather
  type: http
  seq: 2

http:
  method: GET
  url: https://api.openweathermap.org/data/2.5/weather?lat=37.7749&lon=-122.4194&appid={{API-Key}}
  params:
    - name: lat
      value: "37.7749"
      type: query
    - name: lon
      value: "-122.4194"
      type: query
    - name: appid
      value: "{{API-Key}}"
      type: query
  auth:
    type: apikey
    key: "{{API-Key}}"
    placement: query

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
